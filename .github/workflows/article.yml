name: Auto Article

on:
  schedule:
    - cron: "0 2 * * 1,3,5"   # Senin, Rabu, Jumat 09:00 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-article
  cancel-in-progress: false

jobs:
  article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate artikel
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ARTICLE_MODEL: ${{ vars.ARTICLE_MODEL }}
        run: node scripts/generate-article.js

      - name: Build sitemap, kartu, dan daftar artikel
        run: node scripts/build-seo.js

      - name: Validasi SEO
        run: node scripts/check-seo.js

      - name: Commit dan push ke main
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add articles/ data/ sitemap.xml index.html
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan"
            exit 0
          fi
          git commit -m "content: artikel otomatis [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main