name: Auto Article

on:
  schedule:
    - cron: "0 2 * * 1,3,5"   # Senin, Rabu, Jumat 09:00 WIB
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate artikel
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-article.js

      - name: Build sitemap dan kartu
        run: node scripts/build-seo.js

      - name: Validasi SEO
        run: node scripts/check-seo.js

      - name: Buat Pull Request untuk review
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/article
          commit-message: "content: artikel otomatis"
          title: "Artikel otomatis untuk review"
          body: |
            Artikel dibuat otomatis dan lolos validasi.
            Cek sebelum merge: harga, kebenaran informasi tur, dan nada bahasa.
          add-paths: |
            articles/
            data/articles.json
            sitemap.xml
            index.html