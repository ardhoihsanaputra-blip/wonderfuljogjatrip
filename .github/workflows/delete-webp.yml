name: Delete Selected WebP
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove selected .webp files
        run: |
          git rm -r --ignore-unmatch -- \
            Bromo-sunrise-penanjakan-1.webp \
            bromo-sunrise-penanjakan-1.webp \
            bromo-sunrise-penanjakan-2.webp \
            ijen-crater-1.webp \
            tumpak-sewu-waterfall-1.webp \
            tumpak-sewu-waterfall-2.webp
          if git diff --cached --quiet; then
            echo "No matching files to remove"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Delete 5 selected WebP images"
            git push
          fi
