    let activeFilter = "all";
    let selectedTourForBooking = null;
    const activePhotoIndexMap = {};

    // 1. Ekstrak kata kunci & judul otomatis dari nama file foto
    function extractKeywordsFromFilename(filePath) {
      const rawName = decodeURIComponent(filePath.split("/").pop().split("?")[0]);
      const nameWithoutExt = rawName.replace(/\.[^/.]+$/, "");

      // Pisahkan tanda hubung, underscore, titik, atau camelCase menjadi kata bersih
      const cleanPhrase = nameWithoutExt
        .replace(/([a-z])([A-Z])/g, "$1 $2")
        .replace(/[-_.]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      // Kata kunci huruf kecil (abaikan kata sambung umum & angka murni)
      const stopWords = new Set(["dan", "di", "ke", "dari", "yang", "foto", "img", "image", "pic", "whatsapp", "wa"]);
      const keywords = cleanPhrase
        .toLowerCase()
        .split(" ")
        .filter((word) => word.length > 1 && !/^\d+$/.test(word) && !stopWords.has(word));

      // Judul rapi (Title Case) untuk alt SEO & caption Lightbox
      const title = cleanPhrase
        .replace(/\b\w/g, (char) => char.toUpperCase()) || "Destinasi Wonderful Trip Jogja";

      return {
        src: filePath,
        title,
        keywords,
        keywordString: keywords.join(", ")
      };
    }

    // 2. Cocokkan foto ke paket terbaik berdasarkan skor kata kunci
    function assignPhotoToBestTour(photoObj) {
      let bestTour = null;
      let highestScore = 0;

      toursData.forEach((tour) => {
        let score = 0;

        // Jika nama file diawali prefix persis, beri skor tinggi
        const normalizedFile = photoObj.src.toLowerCase();
        if (normalizedFile.includes(tour.prefix.toLowerCase())) {
          score += 5;
        }

        // Hitung kecocokan per kata kunci
        photoObj.keywords.forEach((kw) => {
          if (tour.keywords.includes(kw)) {
            score += 1;
          }
          if (tour.priorityKeywords && tour.priorityKeywords.includes(kw)) {
            score += 2.5;
          }
        });

        if (score > highestScore) {
          highestScore = score;
          bestTour = tour;
        }
      });

      if (bestTour && highestScore > 0) {
        bestTour.photos.push(photoObj);
        return bestTour.title;
      }
      return null;
    }

    // 3. Ambil semua file gambar langsung dari repositori GitHub
    async function loadPhotosFromGitHub() {
      const branches = ["main", "master"];
      let imageFiles = [];

      for (const branch of branches) {
        try {
          const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${branch}?recursive=1`;
          const response = await fetch(apiUrl);
          if (!response.ok) continue;

          const data = await response.json();
          if (Array.isArray(data.tree)) {
            imageFiles = data.tree
              .filter((item) => item.type === "blob" && /\.(jpe?g|png|webp|avif)$/i.test(item.path))
              .map((item) => item.path)
              .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            break;
          }
        } catch (err) {
          console.warn(`Gagal membaca branch ${branch}:`, err);
        }
      }

      if (imageFiles.length > 0) {
        imageFiles.forEach((filePath) => {
          const photoData = extractKeywordsFromFilename(filePath);
          const matchedPackage = assignPhotoToBestTour(photoData);
          console.info(`[Auto-Keyword] ${filePath} -> Kata kunci: [${photoData.keywordString}] -> Paket: ${matchedPackage || "Tidak cocok"}`);
        });
      } else {
        // Fallback jika dibuka offline / terkena limit API: cek folder images/ dengan nama prefix standar
        await probeLocalFallbackImages();
      }

      renderTours();
    }

    // Cadangan pengecekan file lokal jika GitHub API tidak terjangkau
    async function probeLocalFallbackImages() {
      const extensions = ["jpg", "JPG", "jpeg", "png", "webp"];
      const checks = [];

      toursData.forEach((tour) => {
        for (let i = 1; i <= 4; i++) {
          extensions.forEach((ext) => {
            const candidatePath = `images/${tour.prefix}-${i}.${ext}`;
            checks.push(
              new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                  tour.photos.push(extractKeywordsFromFilename(candidatePath));
                  resolve();
                };
                img.onerror = () => resolve();
                img.src = candidatePath;
              })
            );
          });
        }
      });

      await Promise.all(checks);
    }

    // 4. Render Kartu Paket Wisata
    function renderTours() {
      const grid = document.getElementById("tours-grid");
      const filteredTours = toursData.filter((tour) => {
        if (activeFilter === "all") return true;
        return tour.types.includes(activeFilter);
      });

      grid.innerHTML = filteredTours.map((tour) => {
        const currentIndex = activePhotoIndexMap[tour.id] || 0;
        const activePhoto = tour.photos[currentIndex] || null;

        // Gabungkan kata kunci paket + kata kunci otomatis dari semua foto miliknya
        const autoKeywords = Array.from(
          new Set([
            ...tour.keywords,
            ...tour.photos.flatMap((p) => p.keywords)
          ])
        );

        const mediaBlock = activePhoto
          ? `
            <div class="relative h-56 bg-slate-900 overflow-hidden group">
              <img
                src="${activePhoto.src}"
                alt="${activePhoto.title} - ${tour.title}"
                data-keywords="${autoKeywords.join(", ")}"
                onclick="openLightbox('${activePhoto.src}', '${activePhoto.title.replace(/'/g, "\\'")} (${tour.title.replace(/'/g, "\\'")})')"
                class="w-full h-full object-cover group-hover:scale-105 transition duration-500 cursor-zoom-in"
                loading="lazy"
              />
              <div class="absolute inset-0 bg-gradient-to-t from-black/65 via-transparent to-transparent pointer-events-none"></div>
              <span class="absolute bottom-3 left-3 text-[11px] font-medium text-white/95 bg-black/50 backdrop-blur-xs px-2.5 py-1 rounded-lg">
                ${activePhoto.title}
              </span>
              ${tour.photos.length > 1 ? `
                <div class="absolute bottom-3 right-3 flex gap-1.5">
                  ${tour.photos.map((photo, idx) => `
                    <button
                      type="button"
                      onclick="switchCardPhoto('${tour.id}', ${idx})"
                      title="${photo.title}"
                      class="w-6 h-6 rounded-md overflow-hidden border-2 transition ${idx === currentIndex ? "border-accent-500 scale-110" : "border-white/60 opacity-80 hover:opacity-100"}">
                      <img src="${photo.src}" alt="${photo.title}" class="w-full h-full object-cover" />
                    </button>
                  `).join("")}
                </div>
              ` : ""}
            </div>
          `
          : `
            <div class="relative h-56 bg-gradient-to-br ${tour.gradient} p-6 flex flex-col justify-end text-white">
              <span class="text-xs uppercase tracking-wider text-white/75 font-semibold mb-1">Wonderful Trip Jogja</span>
              <p class="font-bold text-lg leading-snug">${tour.title}</p>
            </div>
          `;

        return `
          <article
            data-keywords="${autoKeywords.join(", ")}"
            class="bg-white rounded-2xl border border-slate-200/90 shadow-xs hover:shadow-md transition overflow-hidden flex flex-col fade-in">
            ${mediaBlock}

            <div class="p-6 flex-1 flex flex-col">
              <div class="flex flex-wrap items-center gap-1.5 mb-3">
                ${tour.types.includes("sharing") ? `<span class="text-[11px] font-bold uppercase tracking-wide px-2.5 py-0.5 rounded-full bg-brand-50 text-brand-700 border border-brand-200">Sharing</span>` : ""}
                ${tour.types.includes("private") ? `<span class="text-[11px] font-bold uppercase tracking-wide px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200">Private</span>` : ""}
                <span class="text-xs text-slate-500 ml-auto">${tour.duration}</span>
              </div>

              <h3 class="text-lg font-bold text-slate-900 leading-snug mb-2">${tour.title}</h3>
              <p class="text-slate-600 text-sm leading-relaxed mb-4">${tour.description}</p>

              <ul class="space-y-1.5 text-xs text-slate-600 mb-4">
                ${tour.highlights.map((item) => `
                  <li class="flex items-start gap-2">
                    <span class="text-brand-600 font-bold mt-0.5">✓</span>
                    <span>${item}</span>
                  </li>
                `).join("")}
              </ul>

              ${autoKeywords.length > 0 ? `
                <div class="flex flex-wrap gap-1 mb-5">
                  ${autoKeywords.slice(0, 5).map((kw) => `
                    <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md">#${kw}</span>
                  `).join("")}
                </div>
              ` : ""}

              <div class="mt-auto pt-4 border-t border-slate-100 flex items-center justify-between gap-3">
                <div class="text-xs text-slate-500">
                  <span class="block text-[11px]">Penjemputan</span>
                  <strong class="text-slate-800">${tour.pickup}</strong>
                </div>
                <button
                  type="button"
                  onclick="openBookingModal('${tour.id}')"
                  class="bg-brand-700 hover:bg-brand-800 text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition cursor-pointer">
                  Pesan Paket Ini
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function switchCardPhoto(tourId, photoIdx) {
      activePhotoIndexMap[tourId] = photoIdx;
      renderTours();
    }

    // 5. Filter Sharing / Private
    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.filter;
        document.querySelectorAll(".filter-btn").forEach((b) => {
          b.classList.remove("bg-white", "text-slate-900", "shadow-sm");
          b.classList.add("text-slate-600");
        });
        btn.classList.add("bg-white", "text-slate-900", "shadow-sm");
        btn.classList.remove("text-slate-600");
        renderTours();
      });
    });

    // 6. Modal Pemesanan WhatsApp
    function openBookingModal(tourId) {
      selectedTourForBooking = toursData.find((t) => t.id === tourId);
      if (!selectedTourForBooking) return;

      document.getElementById("modal-tour-title").textContent = selectedTourForBooking.title;

      // Sesuaikan radio button jika user sedang memilih filter Private
      const targetRadioValue = activeFilter === "private" ? "Private Tour" : "Sharing Tour";
      const radioEl = document.querySelector(`input[name="tourType"][value="${targetRadioValue}"]`);
      if (radioEl) radioEl.checked = true;

      const modal = document.getElementById("booking-modal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeBookingModal() {
      const modal = document.getElementById("booking-modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    document.getElementById("booking-form").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!selectedTourForBooking) return;

      const tourType = document.querySelector('input[name="tourType"]:checked').value;
      const date = document.getElementById("booking-date").value;
      const pax = document.getElementById("booking-pax").value;
      const pickup = document.getElementById("booking-pickup").value.trim();
      const name = document.getElementById("booking-name").value.trim();

      const message =
        `Halo Wonderful Trip Jogja, saya ingin memesan paket wisata:\n\n` +
        `• *Paket:* ${selectedTourForBooking.title}\n` +
        `• *Tipe:* ${tourType}\n` +
        `• *Tanggal:* ${date}\n` +
        `• *Peserta:* ${pax} orang\n` +
        `• *Penjemputan:* ${pickup}\n` +
        `• *Nama:* ${name}\n\n` +
        `Mohon informasi ketersediaan dan detail harganya. Terima kasih.`;

      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, "_blank", "noopener,noreferrer");
      closeBookingModal();
    });

    // 7. Lightbox Preview Foto
    function openLightbox(src, caption) {
      const modal = document.getElementById("lightbox-modal");
      document.getElementById("lightbox-img").src = src;
      document.getElementById("lightbox-caption").textContent = caption;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeLightbox() {
      const modal = document.getElementById("lightbox-modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeBookingModal();
        closeLightbox();
      }
    });

    // Jalankan pemuatan foto & kata kunci otomatis saat halaman dibuka
    document.addEventListener("DOMContentLoaded", () => {
      renderTours();
      loadPhotosFromGitHub();
    });
